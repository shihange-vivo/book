<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="950" viewBox="0 0 1700 950" role="img" aria-labelledby="t d"><title id="t">BlueOS RTOS 动态加载分层与稳定边界</title><desc id="d">应用与系统 libc 经内核 application/thread_group 后端装载；ApplicationLoader 调用 blueos_loader 的 ImageLoader/DynamicLinker，SystemDsoRegistry 管理系统 DSO 实例；内核 adapters 实现 ElfReader/ImageMemory/CodeCache trait 并提供 VFS/内存/cache 能力。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0891b2"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:16px;font-weight:700}.b{font-size:14px;fill:#334155}.s{font-size:13px;fill:#475569}.xs{font-size:12px;fill:#64748b}.t{font-size:20px;font-weight:700;fill:#334155}.a{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.ca{fill:none;stroke:#0891b2;stroke-width:2;stroke-dasharray:6 4;marker-end:url(#c)}.ga{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#g)}</style></defs><rect width="1700" height="950" fill="#fff"/><text x="850" y="52" text-anchor="middle" font-size="27" font-weight="700">BlueOS RTOS 动态加载分层与稳定边界</text>
  <g><rect x="520" y="95" width="300" height="80" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="670" y="126" text-anchor="middle">动态应用（shell / hello…）</text><text class="b" x="670" y="153" text-anchor="middle">ET_DYN / PIE · scrt1 + 私有 libfoo.so</text><rect x="860" y="95" width="300" height="80" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text class="h" x="1010" y="126" text-anchor="middle">/system/lib/&lt;abi&gt;/libc.so.1</text><text class="b" x="1010" y="153" text-anchor="middle">librs + blueos_scal_swi</text></g>
  <rect x="60" y="230" width="1140" height="650" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text class="t" x="85" y="272">BlueOS 内核（共享特权地址空间）</text>
  <g><rect x="100" y="305" width="330" height="115" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/><text class="h" x="265" y="332" text-anchor="middle">ApplicationManager</text><text class="xs" x="265" y="357" text-anchor="middle">/kernel/application/manager.rs</text><text class="s" x="265" y="381" text-anchor="middle">统一准入 · handle · state · 后端分派</text><text class="s" x="265" y="404" text-anchor="middle">不参与线程调度</text></g>
  <g><rect x="490" y="290" width="690" height="380" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><text x="835" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">/kernel/application/thread_group/</text><text class="xs" x="835" y="334" text-anchor="middle">后端（当前唯一实现）</text></g>
  <g><rect x="510" y="350" width="320" height="120" rx="13" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text class="h" x="670" y="380" text-anchor="middle">ApplicationLoader</text><text class="xs" x="670" y="407" text-anchor="middle">thread_group/loader.rs</text><text class="s" x="670" y="434" text-anchor="middle">启动期链接前端：调用 DynamicLinker</text><rect x="860" y="350" width="300" height="120" rx="13" fill="#ffedd5" stroke="#fb923c" stroke-width="2"/><text class="h" x="1010" y="380" text-anchor="middle">SystemDsoRegistry</text><text class="xs" x="1010" y="407" text-anchor="middle">thread_group/system_dso.rs</text><text class="s" x="1010" y="434" text-anchor="middle">按需首装 · lease · 静默卸载</text></g>
  <g><rect x="510" y="545" width="670" height="80" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/><text class="s" x="845" y="573" text-anchor="middle">adapters/：VfsElfReader · SystemLibraryPaths（application/ 通用）</text><text class="xs" x="845" y="596" text-anchor="middle">FlatImageMemory · ArtifactResolver（thread_group/ 模型特有）· cache → arch/*/cache.rs</text></g>
  <g><rect x="1250" y="300" width="330" height="470" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="1262" y="328" font-size="15" font-weight="700">blueos_loader rlib　/loader/</text><text class="xs" x="1262" y="352">独立于内核的 crate，静态编入内核</text><rect x="1268" y="375" width="294" height="95" rx="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text class="h" x="1415" y="400" text-anchor="middle">ImageLoader</text><text class="s" x="1415" y="423" text-anchor="middle">image/：单 ELF 装载</text><text class="s" x="1415" y="446" text-anchor="middle">admit → 布局 → 复制清零</text><text class="s" x="1415" y="469" text-anchor="middle">S0–S4 分阶段映像</text><rect x="1268" y="485" width="294" height="95" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text class="h" x="1415" y="510" text-anchor="middle">DynamicLinker</text><text class="s" x="1415" y="533" text-anchor="middle">dynamic_linker/：多 DSO</text><text class="s" x="1415" y="556" text-anchor="middle">依赖图 · scope · 符号解析</text><text class="s" x="1415" y="579" text-anchor="middle">relocation · LinkSession 事务回滚</text><rect x="1268" y="595" width="294" height="175" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text class="h" x="1415" y="622" text-anchor="middle">核心接口（trait）</text><text class="b" x="1415" y="646" text-anchor="middle">ElfReader（reader.rs）</text><text class="b" x="1415" y="670" text-anchor="middle">ImageMemory（memory.rs）</text><text class="b" x="1415" y="694" text-anchor="middle">CodeCache（memory.rs）</text><text class="b" x="1415" y="718" text-anchor="middle">ArchRelocator（relocation/arch/）</text><text class="xs" x="1415" y="740" text-anchor="middle">crate 内实现</text><text class="xs" x="1415" y="760" text-anchor="middle">Resolver：内核 adapters 实现</text></g>
  <path class="a" d="M670 175V248H420V305"/><text x="545" y="258" text-anchor="middle" font-size="12" fill="#475569">ApplicationLaunch syscall</text><text x="265" y="454" text-anchor="middle" font-size="12" fill="#64748b">boot 自举：内核直呼 launch() 装载 shell（唯一函数调用例外）</text><path class="a" d="M1010 175V350"/><path class="a" d="M430 362H490"/><text x="460" y="352" text-anchor="middle" font-size="12" fill="#475569">分派</text><path class="a" d="M830 410H860"/><text x="845" y="442" text-anchor="middle" font-size="10" fill="#475569">lease</text><path class="a" d="M1180 410H1250"/><text x="1215" y="396" text-anchor="middle" font-size="12" fill="#475569">调用 link()</text><path class="ca" d="M1180 610H1268"/><text x="1218" y="596" text-anchor="middle" font-size="12" fill="#0891b2">trait 回调</text><path class="ga" d="M845 625V790"/>
  <rect x="155" y="790" width="985" height="70" rx="14" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/><text x="647" y="832" text-anchor="middle" font-size="16"><tspan font-weight="700">内核稳定服务边界</tspan>　VFS　│　allocator　│　MPU/MMU　│　scheduler + thread　│　版本化 syscall ABI</text>
  <rect x="390" y="900" width="920" height="45" rx="12" fill="#fefce8" stroke="#eab308"/><text x="850" y="922" text-anchor="middle" font-size="13" fill="#713f12">blueos_loader 不依赖内核对象；应用与 DSO 只经 libc.so.1 的 SWI 使用内核 ABI，链接核心所需能力由内核 adapters 以 trait 提供。</text>
</svg>
