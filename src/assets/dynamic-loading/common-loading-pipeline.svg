<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="700" viewBox="0 0 1700 700" role="img" aria-labelledby="t d"><title id="t">跨项目共同的动态加载主流程</title><desc id="d">动态加载从输入对象开始，依次经过准入与映射准备、依赖与链接、收口发布与启动、退出与回收。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:17px;font-weight:700}.b{font-size:14px;fill:#334155}.e{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}</style></defs><rect width="1700" height="700" fill="#fff"/><text x="850" y="52" text-anchor="middle" font-size="27" font-weight="700">跨项目共同的动态加载主流程</text>
  <path class="e" d="M225 290H270"/><path class="e" d="M600 290H640"/><path class="e" d="M970 290H1010"/><path class="e" d="M1340 290H1380"/>
  <g><rect x="45" y="240" width="180" height="100" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text class="h" x="135" y="279" text-anchor="middle">输入对象</text><text class="b" x="135" y="308" text-anchor="middle">artifact / package / module</text></g>
  <g><rect x="270" y="160" width="330" height="260" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="292" y="195">① 准入与映射准备</text><text class="b" x="292" y="240">准入：格式 / 架构 / ABI / 来源 / 配额</text><text class="b" x="292" y="276">预扫描：segment / section / 总布局</text><text class="b" x="292" y="312">reserve：未发布目标内存</text><text class="b" x="292" y="348">copy / zero：复制内容并清零 BSS</text></g>
  <g><rect x="640" y="160" width="330" height="260" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text class="h" x="662" y="195">② 依赖与链接</text><text class="b" x="662" y="240">metadata：dynsym / reloc / init</text><text class="b" x="662" y="276">dependency closure：发现、去重、建图</text><text class="b" x="662" y="312">scope：冻结符号查找范围</text><text class="b" x="662" y="348">relocation：relative → data/GOT → PLT</text></g>
  <g><rect x="1010" y="160" width="330" height="260" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text class="h" x="1032" y="195">③ 收口、发布与启动</text><text class="b" x="1032" y="240">seal：最终权限 / RELRO / cache sync</text><text class="b" x="1032" y="276">publish：原子加入 registry / namespace</text><text class="b" x="1032" y="312">initialize：依赖优先执行 ctor</text><text class="b" x="1032" y="348">enter：调用入口或创建执行线程</text></g>
  <g><rect x="1380" y="160" width="275" height="260" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text class="h" x="1402" y="195">④ 退出与回收</text><text class="b" x="1402" y="240">停止新引用</text><text class="b" x="1402" y="276">等待线程 / 回调 / TLS 静默</text><text class="b" x="1402" y="312">逆序 fini</text><text class="b" x="1402" y="348">unpublish / free</text></g>
  <rect x="270" y="480" width="1070" height="70" rx="14" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/><text x="805" y="509" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">准备期失败：回滚未发布资源</text><text x="805" y="533" text-anchor="middle" font-size="13" fill="#0c4a6e">映射、临时依赖和私有元数据可撤销；publish 后进入实例生命周期</text>
  <rect x="365" y="585" width="970" height="55" rx="14" fill="#f8fafc" stroke="#cbd5e1"/><text x="850" y="618" text-anchor="middle" font-size="14" fill="#475569">纯装载器可能裁剪 dependency / scope；ET_REL 模块可能按 section 装入，但保留下来的阶段仍不能颠倒。</text>
</svg>
