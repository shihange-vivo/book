<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720" role="img" aria-labelledby="t d"><title id="t">单个 ELF image 的安全映射算法</title><desc id="d">ELF image 依次经过预扫描、选址、复制清零、重定位收口、缓存同步和发布，失败则逆序回滚。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#334155}.a{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1800" height="720" fill="#fff"/><text x="900" y="52" text-anchor="middle" font-size="27" font-weight="700">单个 ELF image 的安全映射算法</text>
  <g><rect x="45" y="155" width="245" height="115" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="168" y="188" text-anchor="middle">① 预扫描 PT_LOAD</text><text class="b" x="168" y="218" text-anchor="middle">checked range / span</text><text class="b" x="168" y="245" text-anchor="middle">上限 / 对齐 / 权限</text><rect x="335" y="145" width="270" height="135" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="470" y="178" text-anchor="middle">② 选址与 reserve</text><text class="b" x="470" y="208" text-anchor="middle">满足 max p_align</text><text class="b" x="470" y="235" text-anchor="middle">计算显式 load_bias</text><text class="b" x="470" y="262" text-anchor="middle">TargetAddr / TargetWord</text><rect x="650" y="145" width="270" height="135" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text class="h" x="785" y="178" text-anchor="middle">③ copy / zero</text><text class="b" x="785" y="208" text-anchor="middle">按 segment 复制 file bytes</text><text class="b" x="785" y="235" text-anchor="middle">清 page tail 与 BSS</text><text class="b" x="785" y="262" text-anchor="middle">保留逻辑 region 边界</text><rect x="965" y="145" width="270" height="135" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text class="h" x="1100" y="178" text-anchor="middle">④ relocation 后 seal</text><text class="b" x="1100" y="208" text-anchor="middle">写入前逐项 check_range</text><text class="b" x="1100" y="235" text-anchor="middle">最终 PF_* / RELRO</text><text class="b" x="1100" y="262" text-anchor="middle">拒绝 W+X</text><rect x="1280" y="155" width="230" height="115" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/><text class="h" x="1395" y="188" text-anchor="middle">⑤ cache / fence</text><text class="b" x="1395" y="218" text-anchor="middle">D-cache clean</text><text class="b" x="1395" y="245" text-anchor="middle">I-invalidate / fence.i</text><rect x="1555" y="155" width="210" height="115" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text class="h" x="1660" y="188" text-anchor="middle">⑥ publish</text><text class="b" x="1660" y="218" text-anchor="middle">入口 / 符号 / LinkMap</text><text class="b" x="1660" y="245" text-anchor="middle">才对其他线程可见</text></g><path class="a" d="M290 213H335M605 213H650M920 213H965M1235 213H1280M1510 213H1555"/>
  <rect x="340" y="385" width="1120" height="75" rx="13" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="900" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">任何 prepare / relocate / seal 步骤失败</text><text x="900" y="443" text-anchor="middle" font-size="14" fill="#7f1d1d">按逆序释放临时 allocation 和 region；不得留下半初始化对象，不得运行 ctor。</text><path d="M1100 280V385" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <rect x="235" y="545" width="560" height="70" rx="13" fill="#f8fafc" stroke="#64748b"/><text class="h" x="515" y="574" text-anchor="middle">FlatImageMemory</text><text class="b" x="515" y="599" text-anchor="middle">一次连续 RAM allocation，仍保留 RX/RO/RW 逻辑 region</text><rect x="1005" y="545" width="560" height="70" rx="13" fill="#f8fafc" stroke="#64748b"/><text class="h" x="1285" y="574" text-anchor="middle">MPU / PMP / MMU backend</text><text class="b" x="1285" y="599" text-anchor="middle">按硬件粒度归并 region 并实际 protect；core 算法不变</text>
</svg>
