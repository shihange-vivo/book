<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="t d">
  <title id="t">从编译到运行：静态链接器与运行时链接器的接力</title><desc id="d">Rust 和 C 源码先编译为 ET_REL 对象，再由静态链接器生成 PIE 主程序和 DSO，运行时由 ApplicationLoader 和 DynamicLinker 映射、解析依赖并重定位。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#334155}.n{font-size:12px;fill:#64748b}.e{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="720" fill="#fff"/><text x="800" y="52" text-anchor="middle" font-size="27" font-weight="700">从编译到运行：静态链接器与运行时链接器的接力</text>
  <rect x="40" y="95" width="980" height="500" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="70" y="130" font-size="18" font-weight="700" fill="#1e3a8a">构建期</text>
  <rect x="1045" y="95" width="515" height="500" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="1075" y="130" font-size="18" font-weight="700" fill="#166534">运行期</text>
  <path class="e" d="M288 235H335"/><path class="e" d="M545 235H590"/><path class="e" d="M820 235H855"/><path class="e" d="M920 300V350H640V380"/><path class="e" d="M920 300V350H885V380"/><path class="e" d="M640 500V520H1080V350H1200V330"/><path class="e" d="M990 440H1065V290H1100"/><path d="M1302 330V400" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
  <g><rect x="78" y="190" width="210" height="90" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="183" y="225" text-anchor="middle">Rust / C 源码</text><text class="b" x="183" y="251" text-anchor="middle">应用、libfoo、librs_swi</text></g>
  <g><rect x="335" y="180" width="210" height="110" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text class="h" x="440" y="211" text-anchor="middle">compiler</text><text class="b" x="440" y="237" text-anchor="middle">PIC 编译</text><text class="b" x="440" y="260" text-anchor="middle">保留未定义外部引用</text></g>
  <g><rect x="590" y="180" width="230" height="110" rx="14" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="705" y="211" text-anchor="middle">ET_REL .o / rlib</text><text class="b" x="705" y="237" text-anchor="middle">sections · symbols · relocation</text><text class="n" x="705" y="262" text-anchor="middle">尚未形成发布 ABI</text></g>
  <g><rect x="855" y="170" width="130" height="130" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text class="h" x="920" y="201" text-anchor="middle">static linker</text><text class="b" x="920" y="228" text-anchor="middle">合并 section</text><text class="b" x="920" y="251" text-anchor="middle">解决镜像内引用</text><text class="b" x="920" y="274" text-anchor="middle">保留未知项</text></g>
  <g><rect x="530" y="380" width="220" height="120" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text class="h" x="640" y="410" text-anchor="middle">PIE 主程序</text><text class="b" x="640" y="435" text-anchor="middle">ET_DYN + PT_DYNAMIC</text><text class="b" x="640" y="458" text-anchor="middle">DT_NEEDED: libc.so.1</text><text class="n" x="640" y="482" text-anchor="middle">GOT / PLT / dynamic reloc</text></g>
  <g><rect x="780" y="380" width="210" height="120" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><text class="h" x="885" y="410" text-anchor="middle">共享库 DSO</text><text class="b" x="885" y="435" text-anchor="middle">ET_DYN + DT_SONAME</text><text class="b" x="885" y="458" text-anchor="middle">导出动态符号</text><text class="n" x="885" y="482" text-anchor="middle">GOT / PLT / dynamic reloc</text></g>
  <g><rect x="1100" y="180" width="405" height="150" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text class="h" x="1302" y="207" text-anchor="middle">ApplicationLoader</text><text class="n" x="1302" y="229" text-anchor="middle">调用 blueos_loader::DynamicLinker</text><text class="b" x="1302" y="254" text-anchor="middle">映射 PT_LOAD · DT_NEEDED 依赖闭包</text><text class="b" x="1302" y="278" text-anchor="middle">scope + relocation</text><text class="b" x="1302" y="302" text-anchor="middle">RELRO + cache sync</text></g>
  <g><rect x="1100" y="400" width="405" height="130" rx="14" fill="#fff" stroke="#16a34a" stroke-width="2"/><text class="h" x="1302" y="431" text-anchor="middle">已绑定运行映像</text><text class="b" x="1302" y="458" text-anchor="middle">确定 load bias 与符号地址</text><text class="b" x="1302" y="482" text-anchor="middle">发布 LinkMap / InitPlan</text><text class="b" x="1302" y="506" text-anchor="middle">进入 blueos_scrt1 → main</text></g>
  <rect x="300" y="530" width="665" height="42" rx="12" fill="#fff7ed" stroke="#fb923c"/><text x="632" y="557" text-anchor="middle" font-size="14" fill="#9a3412">运行时未知项：装载地址、跨 DSO 符号、GOT/PLT 槽</text>
  <rect x="225" y="620" width="1150" height="55" rx="14" fill="#f8fafc" stroke="#94a3b8"/><text x="800" y="644" text-anchor="middle" font-size="14" font-weight="700">稳定边界：C ABI</text><text x="800" y="665" text-anchor="middle" font-size="13" fill="#475569">Rust core/alloc/std 首期静态 PIC；不把 Rust dylib ABI 暴露为系统 ABI</text>
</svg>
