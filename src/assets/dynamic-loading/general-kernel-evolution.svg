<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="t d"><title id="t">BlueOS 动态加载从 RTOS 向通用内核的演进</title><desc id="d">上半部分展示当前 RTOS、受保护 RTOS、通用内核进程三阶段；下半部分展开未来 exec 与用户态动态解释器的启动流程。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#334155}.a{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#a)}</style></defs><rect width="1800" height="980" fill="#fff"/><text x="900" y="52" text-anchor="middle" font-size="27" font-weight="700">BlueOS 动态加载从 RTOS 向通用内核的演进</text>
  <g><rect x="90" y="110" width="430" height="210" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="305" y="147" text-anchor="middle" font-size="18" font-weight="700">阶段 A　当前 RTOS</text><text class="b" x="305" y="190" text-anchor="middle">共享特权地址空间</text><text class="b" x="305" y="220" text-anchor="middle">application::thread_group + ApplicationLoader</text><text class="b" x="305" y="250" text-anchor="middle">ThreadGroup / ThreadGroupMembership</text><text class="b" x="305" y="280" text-anchor="middle">逻辑权限 + 板级 cache backend</text><rect x="685" y="110" width="430" height="210" rx="16" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="900" y="147" text-anchor="middle" font-size="18" font-weight="700">阶段 B　受保护 RTOS</text><text class="b" x="900" y="190" text-anchor="middle">同一 ApplicationManager；仍以 ThreadGroup 回收</text><text class="b" x="900" y="220" text-anchor="middle">MPU / PMP / MMU 落实 RX/RW/RELRO</text><text class="b" x="900" y="250" text-anchor="middle">copy-in/out + opaque handle</text><text class="b" x="900" y="280" text-anchor="middle">能力检查成为真实安全边界</text><rect x="1280" y="110" width="430" height="210" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="1495" y="147" text-anchor="middle" font-size="18" font-weight="700">阶段 C　通用内核进程</text><text class="b" x="1495" y="190" text-anchor="middle">Process + AddressSpace + user mode</text><text class="b" x="1495" y="220" text-anchor="middle">application::process + exec stage0 + ld.so</text><text class="b" x="1495" y="250" text-anchor="middle">页缓存共享 DSO RX/RO</text><text class="b" x="1495" y="280" text-anchor="middle">每进程私有 RW/GOT/TLS/ctor</text></g><path class="a" d="M520 215H685M1115 215H1280"/><text class="b" x="603" y="202" text-anchor="middle">加强保护</text><text class="b" x="1198" y="192" text-anchor="middle">增加 process 后端</text><text class="b" x="1198" y="211" text-anchor="middle">与 memory backend</text>
  <rect x="180" y="365" width="1440" height="65" rx="13" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="900" y="405" text-anchor="middle" font-size="15"><tspan font-weight="700">全阶段持续复用：</tspan>标准 ELF / dynamic parser　│　依赖图与 scope　│　psABI relocation　│　init/fini plan　│　ABI note / build-id　│　fixture / oracle</text><text x="70" y="505" font-size="21" font-weight="700" fill="#334155">阶段 C 展开：exec + 用户态 ld.so 启动流程</text>
  <g><rect x="65" y="545" width="265" height="115" rx="14" fill="#eff6ff" stroke="#3b82f6"/><text class="h" x="198" y="577" text-anchor="middle">① exec 准入</text><text class="b" x="198" y="607" text-anchor="middle">校验包和主 ELF</text><text class="b" x="198" y="634" text-anchor="middle">创建未发布 Process / AS</text><rect x="350" y="545" width="265" height="115" rx="14" fill="#eff6ff" stroke="#3b82f6"/><text class="h" x="483" y="577" text-anchor="middle">② stage0 映射</text><text class="b" x="483" y="604" text-anchor="middle">只映射 main + PT_INTERP</text><text class="b" x="483" y="629" text-anchor="middle">构造 initial stack 与 auxv</text><rect x="635" y="545" width="265" height="115" rx="14" fill="#f5f3ff" stroke="#8b5cf6"/><text class="h" x="768" y="577" text-anchor="middle">③ 进入用户态 ld.so</text><text class="b" x="768" y="604" text-anchor="middle">read/pread + mmap/mprotect</text><text class="b" x="768" y="629" text-anchor="middle">进程内 resolver</text><rect x="920" y="545" width="295" height="115" rx="14" fill="#f5f3ff" stroke="#8b5cf6"/><text class="h" x="1068" y="577" text-anchor="middle">④ 完成动态链接</text><text class="b" x="1068" y="604" text-anchor="middle">dependency → scope → NOW reloc</text><text class="b" x="1068" y="629" text-anchor="middle">RELRO / cache / per-process LinkMap</text><rect x="1235" y="545" width="230" height="115" rx="14" fill="#f0fdf4" stroke="#22c55e"/><text class="h" x="1350" y="577" text-anchor="middle">⑤ 运行应用</text><text class="b" x="1350" y="607" text-anchor="middle">依赖优先 ctor</text><text class="b" x="1350" y="634" text-anchor="middle">进入 main</text><rect x="1485" y="545" width="250" height="115" rx="14" fill="#fff7ed" stroke="#f97316"/><text class="h" x="1610" y="577" text-anchor="middle">⑥ 进程退出</text><text class="b" x="1610" y="607" text-anchor="middle">逆序 fini</text><text class="b" x="1610" y="634" text-anchor="middle">kernel 回收整个地址空间</text></g><path class="a" d="M330 603H350M615 603H635M900 603H920M1215 603H1235M1465 603H1485"/>
  <rect x="190" y="735" width="550" height="80" rx="13" fill="#dbeafe" stroke="#60a5fa"/><text class="h" x="465" y="767" text-anchor="middle">内核职责</text><text class="b" x="465" y="794" text-anchor="middle">1–2：可信启动、地址空间和用户态入口；6：整体回收</text><rect x="850" y="735" width="650" height="80" rx="13" fill="#ede9fe" stroke="#a78bfa"/><text class="h" x="1175" y="767" text-anchor="middle">用户态 ld.so / libc 职责</text><text class="b" x="1175" y="794" text-anchor="middle">3–5：普通 DSO 图、符号绑定、relocation、构造与进入 main</text>
  <rect x="340" y="875" width="1120" height="48" rx="12" fill="#fefce8" stroke="#eab308"/><text x="900" y="905" text-anchor="middle" font-size="14" fill="#713f12">阶段 B 先验证保护和地址边界；阶段 C 才启用 Process、Linux 风格 initial stack 与 PT_INTERP。lazy binding 仍不是必选项。</text>
</svg>
