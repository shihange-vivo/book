<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="780" viewBox="0 0 1800 780" role="img" aria-labelledby="t d"><title id="t">BlueOS 动态应用从 SDK 编译到可信运行时解析</title><desc id="d">源码经统一 PIC SDK/sysroot 和 clang + LLD 产物策略生成 PIE 与 DSO，通过产物契约检查、签名、安装门禁后供运行时解析。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:15px;font-weight:700}.b{font-size:13px;fill:#334155}.a{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1800" height="780" fill="#fff"/><text x="900" y="52" text-anchor="middle" font-size="27" font-weight="700">BlueOS 动态应用：从 SDK 编译到可信运行时解析</text><rect x="45" y="85" width="660" height="580" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="70" y="122" font-size="18" font-weight="700">构建</text><rect x="745" y="85" width="550" height="580" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><text x="770" y="122" font-size="18" font-weight="700">检查与交付</text><rect x="1335" y="85" width="420" height="580" rx="18" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><text x="1360" y="122" font-size="18" font-weight="700">安装与运行</text>
  <rect x="110" y="165" width="290" height="65" rx="12" fill="#fff" stroke="#3b82f6"/><text class="h" x="255" y="204" text-anchor="middle">应用 / librs / 私有 DSO 源码</text><rect x="445" y="140" width="215" height="120" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text class="h" x="553" y="169" text-anchor="middle">统一 PIC SDK</text><text class="b" x="553" y="194" text-anchor="middle">共享 sysroot；blueos_scrt1/crti/crtn</text><text class="b" x="553" y="216" text-anchor="middle">libc.so；headers；exports</text><text class="b" x="553" y="238" text-anchor="middle">ABI schema</text><rect x="240" y="305" width="290" height="95" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text class="h" x="385" y="337" text-anchor="middle">clang + LLD 产物策略</text><text class="b" x="385" y="365" text-anchor="middle">PIC / PIE or -shared</text><text class="b" x="385" y="387" text-anchor="middle">NOW + RELRO + noexecstack</text><path class="a" d="M255 230V270H385V305M553 260V280H385V305"/>
  <g><rect x="90" y="470" width="175" height="70" rx="12" fill="#fff" stroke="#64748b"/><text class="b" x="178" y="499" text-anchor="middle">main PIE</text><text class="b" x="178" y="522" text-anchor="middle">blueos_scrt1 + DT_NEEDED</text><rect x="290" y="470" width="175" height="70" rx="12" fill="#fff" stroke="#f97316"/><text class="b" x="378" y="499" text-anchor="middle">libc.so.1</text><text class="b" x="378" y="522" text-anchor="middle">SONAME + exports</text><rect x="490" y="470" width="175" height="70" rx="12" fill="#fff" stroke="#8b5cf6"/><text class="b" x="578" y="499" text-anchor="middle">private *.so</text><text class="b" x="578" y="522" text-anchor="middle">SONAME + NEEDED</text><path class="a" d="M385 400V435H178V470M385 400V470M385 400V435H578V470"/></g>
  <rect x="815" y="155" width="410" height="230" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="1020" y="190" text-anchor="middle" font-size="16" font-weight="700">Artifact Contract Checker</text><text class="b" x="1020" y="229" text-anchor="middle">ELF class / machine / ABI note</text><text class="b" x="1020" y="258" text-anchor="middle">PT_INTERP policy / DT_NEEDED / SONAME</text><text class="b" x="1020" y="287" text-anchor="middle">relocation whitelist / exports</text><text class="b" x="1020" y="316" text-anchor="middle">无 TEXTREL / W+X；build-id</text><text class="b" x="1020" y="345" text-anchor="middle">readelf + objdump + 自定义校验</text><path class="a" d="M265 505H730V240H815M465 505H745V270H815M665 505H760V300H815"/>
  <rect x="790" y="455" width="270" height="100" rx="12" fill="#fff" stroke="#8b5cf6"/><text class="h" x="925" y="486" text-anchor="middle">签名应用包</text><text class="b" x="925" y="512" text-anchor="middle">manifest + app.elf + lib/*.so</text><text class="b" x="925" y="535" text-anchor="middle">hash / build-id / quotas / min ABI</text><rect x="1080" y="455" width="190" height="100" rx="12" fill="#fff" stroke="#f97316"/><text class="h" x="1175" y="486" text-anchor="middle">签名系统 DSO</text><text class="b" x="1175" y="512" text-anchor="middle">immutable libc.so.1</text><text class="b" x="1175" y="535" text-anchor="middle">A/B 与 ABI 门禁</text><path class="a" d="M1020 385V420H925V455M1020 385V420H1175V455"/>
  <g><rect x="1390" y="155" width="310" height="100" rx="12" fill="#dcfce7" stroke="#22c55e"/><text class="h" x="1545" y="186" text-anchor="middle">安装期二次门禁</text><text class="b" x="1545" y="213" text-anchor="middle">签名 / hash / target</text><text class="b" x="1545" y="236" text-anchor="middle">依赖闭包 / min ABI</text><rect x="1390" y="315" width="310" height="100" rx="12" fill="#dcfce7" stroke="#22c55e"/><text class="h" x="1545" y="346" text-anchor="middle">不可变安装位置</text><text class="b" x="1545" y="373" text-anchor="middle">应用包仓库</text><text class="b" x="1545" y="396" text-anchor="middle">/system/lib/&lt;abi&gt;/libc.so.1</text><rect x="1390" y="475" width="310" height="100" rx="12" fill="#dcfce7" stroke="#22c55e"/><text class="h" x="1545" y="506" text-anchor="middle">ApplicationArtifactResolver</text><text class="b" x="1545" y="533" text-anchor="middle">固定 SONAME 映射</text><text class="b" x="1545" y="556" text-anchor="middle">重验签名 / build-id / ABI note</text><path class="a" d="M1060 505H1320V205H1390M1270 505H1335V235H1390M1545 255V315M1545 415V475"/></g>
  <rect x="380" y="700" width="1040" height="45" rx="12" fill="#fefce8" stroke="#eab308"/><text x="900" y="728" text-anchor="middle" font-size="14" fill="#713f12">构建、安装、加载三道门禁分别防止错误产物、被篡改的包和运行时路径错配，不能互相替代。</text>
</svg>
