<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="700" viewBox="0 0 1750 700" role="img" aria-labelledby="t d"><title id="t">ThreadGroup 资源状态、所有权与失败路径</title><desc id="d">ThreadGroup 以 Loading、Active、Draining、Reaped 四个资源寿命阶段管理应用实例；链接细节由 LinkSession typestate 管理。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#334155}.a{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.f{fill:none;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs><rect width="1750" height="700" fill="#fff"/><text x="875" y="52" text-anchor="middle" font-size="27" font-weight="700">ThreadGroup 资源状态、所有权与失败路径</text>
  <g><rect x="80" y="180" width="300" height="105" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="230" y="212" text-anchor="middle">Loading</text><text class="b" x="230" y="240" text-anchor="middle">ApplicationState: Loading</text><text class="b" x="230" y="265" text-anchor="middle">link / seal / init；业务入口未开放</text><rect x="500" y="180" width="300" height="105" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text class="h" x="650" y="212" text-anchor="middle">Active</text><text class="b" x="650" y="240" text-anchor="middle">ApplicationState: Running</text><text class="b" x="650" y="265" text-anchor="middle">主线程 + 子线程；成员引用保活</text><rect x="920" y="180" width="300" height="105" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text class="h" x="1070" y="212" text-anchor="middle">Draining</text><text class="b" x="1070" y="240" text-anchor="middle">ApplicationState: Stopping / Failed</text><text class="b" x="1070" y="265" text-anchor="middle">禁止新线程；等待退出；逆序 fini</text><rect x="1340" y="180" width="300" height="105" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text class="h" x="1490" y="212" text-anchor="middle">Reaped</text><text class="b" x="1490" y="240" text-anchor="middle">ApplicationState: Terminated / Failed</text><text class="b" x="1490" y="265" text-anchor="middle">unpublish / free / release lease</text></g>
  <path class="a" d="M380 233H500M800 233H920M1220 233H1340"/><text class="b" x="440" y="216" text-anchor="middle">init complete</text><text class="b" x="860" y="205" text-anchor="middle">exit / abort</text><text class="b" x="1280" y="205" text-anchor="middle">最后线程 + fini</text>
  <rect x="80" y="405" width="430" height="75" rx="13" fill="#fee2e2" stroke="#ef4444"/><text x="295" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">准备期失败</text><text x="295" y="461" text-anchor="middle" font-size="13" fill="#7f1d1d">逆序释放临时 mapping / lease；从未对运行线程可见</text><rect x="555" y="405" width="450" height="75" rx="13" fill="#fef3c7" stroke="#f59e0b"/><text x="780" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">ctor 失败</text><text x="780" y="461" text-anchor="middle" font-size="13" fill="#78350f">Loading → Failed → Draining；外部副作用不承诺回滚</text><rect x="1050" y="405" width="620" height="75" rx="13" fill="#ffedd5" stroke="#f97316"/><text x="1360" y="433" text-anchor="middle" font-size="14" font-weight="700" fill="#7c2d12">系统 DSO 末 lease → Quiescing</text><text x="1360" y="459" text-anchor="middle" font-size="13" fill="#7c2d12">证明无线程、回调、TLS destructor、atexit、函数指针和依赖边后才卸载；否则缓存</text><path class="f" d="M180 285V405" stroke="#ef4444"/><path class="f" d="M280 285V350H780V405" stroke="#f59e0b"/><path class="f" d="M1490 285V350H1360V405" stroke="#f97316"/>
  <rect x="300" y="570" width="1150" height="50" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="875" y="601" text-anchor="middle" font-size="14" fill="#334155">资源寿命：main/private DSO region 由 ThreadGroup 持有；系统 libc 映像由 registry 持有，ThreadGroup 只持 SystemDsoLease。</text>
</svg>
