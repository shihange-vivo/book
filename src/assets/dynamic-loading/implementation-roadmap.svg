<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="t d"><title id="t">BlueOS RTOS 动态加载分阶段实施路线</title><desc id="d">从可信 static PIE 基线、扩充现有 blueos_loader、ARM32 Thumb MVP、多 DSO 与全架构覆盖，到 Phase 3 运行期装载和 RTOS 产品化的阶段与验收门槛。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:17px;font-weight:700}.b{font-size:13px;fill:#334155}.a{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#a)}.v{fill:none;stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5;marker-end:url(#a)}</style></defs><rect width="1800" height="760" fill="#fff"/><text x="900" y="52" text-anchor="middle" font-size="27" font-weight="700">BlueOS RTOS 动态加载分阶段实施路线</text>
  <g><rect x="50" y="145" width="285" height="190" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text class="h" x="193" y="179" text-anchor="middle">Phase 0</text><text x="193" y="207" text-anchor="middle" font-size="15" font-weight="700">可信 static PIE 基线</text><text class="b" x="193" y="248" text-anchor="middle">ELF 校验 / load bias / BSS</text><text class="b" x="193" y="276" text-anchor="middle">权限 / cache / rollback</text><text class="b" x="193" y="304" text-anchor="middle">fuzz corpus</text><rect x="395" y="145" width="300" height="190" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text class="h" x="545" y="179" text-anchor="middle">Phase 0.5</text><text x="545" y="207" text-anchor="middle" font-size="15" font-weight="700">扩充 blueos_loader</text><text class="b" x="545" y="248" text-anchor="middle">ImageLoader + DynamicLinker</text><text class="b" x="545" y="276" text-anchor="middle">LinkSession / TargetAddr</text><text class="b" x="545" y="304" text-anchor="middle">Relink differential oracle</text><rect x="755" y="135" width="320" height="210" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text class="h" x="915" y="170" text-anchor="middle">Phase 1</text><text x="915" y="198" text-anchor="middle" font-size="15" font-weight="700">ARM32 Thumb 纵向 MVP</text><text class="b" x="915" y="242" text-anchor="middle">app PIE → libc.so.1</text><text class="b" x="915" y="270" text-anchor="middle">ApplicationLoader / registry / lease</text><text class="b" x="915" y="298" text-anchor="middle">ApplicationStartInfo / emutls / exit</text><rect x="1135" y="145" width="285" height="190" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/><text class="h" x="1278" y="179" text-anchor="middle">Phase 2</text><text x="1278" y="207" text-anchor="middle" font-size="15" font-weight="700">多 DSO + 全架构</text><text class="b" x="1278" y="248" text-anchor="middle">libfoo → libc 依赖图</text><text class="b" x="1278" y="276" text-anchor="middle">ARM hard-float / RV64 / A64 / RV32</text><text class="b" x="1278" y="304" text-anchor="middle">SDK / ABI / debug 门禁</text><rect x="1480" y="145" width="275" height="190" rx="16" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text class="h" x="1618" y="179" text-anchor="middle">Phase 3</text><text x="1618" y="207" text-anchor="middle" font-size="15" font-weight="700">运行期装载 + 产品化</text><text class="b" x="1618" y="248" text-anchor="middle">dlopen / dlsym / 逻辑关闭</text><text class="b" x="1618" y="276" text-anchor="middle">签名 / OTA / allowlist</text><text class="b" x="1618" y="304" text-anchor="middle">并发 / 诊断 / 性能</text></g><path class="a" d="M335 240H395M695 240H755M1075 240H1135M1420 240H1480"/>
  <g><rect x="55" y="415" width="275" height="70" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text class="b" x="193" y="443" text-anchor="middle">Gate 0</text><text class="b" x="193" y="467" text-anchor="middle">mapping corpus 结果确定</text><rect x="405" y="415" width="280" height="70" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text class="b" x="545" y="443" text-anchor="middle">Gate 0.5</text><text class="b" x="545" y="467" text-anchor="middle">ADR / 拒绝清单 / oracle 冻结</text><rect x="770" y="415" width="290" height="70" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text class="b" x="915" y="443" text-anchor="middle">Gate 1</text><text class="b" x="915" y="467" text-anchor="middle">libc 首装、复用、退出、重装</text><rect x="1135" y="415" width="285" height="70" rx="12" fill="#cffafe" stroke="#22d3ee"/><text class="b" x="1278" y="443" text-anchor="middle">Gate 2</text><text class="b" x="1278" y="467" text-anchor="middle">六 target 绑定与 ctor 一致</text><rect x="1480" y="415" width="275" height="70" rx="12" fill="#dcfce7" stroke="#4ade80"/><text class="b" x="1618" y="443" text-anchor="middle">Gate 3</text><text class="b" x="1618" y="467" text-anchor="middle">dl* 并发、OTA、压力、性能达标</text></g><path class="v" d="M193 335V415M545 335V415M915 345V415M1278 335V415M1618 335V415"/>
  <rect x="210" y="575" width="1380" height="65" rx="13" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="900" y="605" text-anchor="middle" font-size="14"><tspan font-weight="700">Phase 3 运行期装载基线</tspan>　dlopen / dlsym / dlerror / dlclose　│　RTLD_NOW | RTLD_LOCAL</text><text x="900" y="628" text-anchor="middle" font-size="13">逻辑关闭、ThreadGroup 延迟回收　│　运行中立即卸载需要独立 UnloadSafe 协议</text><path d="M1618 485V540H1590V608" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
</svg>
