<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="t d"><title id="t">当前 RTOS 与未来通用内核的兼容设计</title><desc id="d">内核始终只有一个 ApplicationManager，RTOS 和未来进程采用不同执行后端，并共享地址空间无关的链接语义核心和工件目录。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b5cf6"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.h{font-size:16px;font-weight:700}.b{font-size:14px;fill:#334155}.a{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.p{fill:none;stroke:#8b5cf6;stroke-width:2;marker-end:url(#p)}</style></defs><rect width="1800" height="900" fill="#fff"/><text x="900" y="52" text-anchor="middle" font-size="27" font-weight="700">当前 RTOS 与未来通用内核：同一 ApplicationManager，替换执行后端</text>
  <rect x="55" y="95" width="640" height="500" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="375" y="143" text-anchor="middle" font-size="21" font-weight="700" fill="#1d4ed8">当前：RTOS 部署外壳</text><rect x="1105" y="95" width="640" height="500" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/><text x="1425" y="143" text-anchor="middle" font-size="21" font-weight="700" fill="#15803d">未来：进程部署外壳</text>
  <g><rect x="180" y="175" width="390" height="75" rx="13" fill="#dbeafe" stroke="#3b82f6"/><text class="h" x="375" y="205" text-anchor="middle">application::thread_group</text><text class="b" x="375" y="230" text-anchor="middle">统一准入 / ThreadGroup / 生命周期</text><rect x="180" y="285" width="390" height="75" rx="13" fill="#ede9fe" stroke="#8b5cf6"/><text class="h" x="375" y="315" text-anchor="middle">kernel ApplicationLoader</text><text class="b" x="375" y="340" text-anchor="middle">驱动 DynamicLinker；拒绝 PT_INTERP</text><rect x="130" y="395" width="490" height="85" rx="13" fill="#ecfeff" stroke="#06b6d4"/><text class="h" x="375" y="428" text-anchor="middle">FlatImageMemory / MPU backend</text><text class="b" x="375" y="455" text-anchor="middle">同一目标地址空间中的 system DSO instance</text><rect x="210" y="515" width="330" height="50" rx="12" fill="#dcfce7" stroke="#22c55e"/><text class="b" x="375" y="546" text-anchor="middle">ApplicationStartInfo → RTOS thread</text></g>
  <g><rect x="1230" y="175" width="390" height="75" rx="13" fill="#dcfce7" stroke="#22c55e"/><text class="h" x="1425" y="205" text-anchor="middle">application::process / exec stage0</text><text class="b" x="1425" y="230" text-anchor="middle">Process / AddressSpace；映射 main + PT_INTERP</text><rect x="1230" y="285" width="390" height="75" rx="13" fill="#ede9fe" stroke="#8b5cf6"/><text class="h" x="1425" y="315" text-anchor="middle">用户态 ld.so</text><text class="b" x="1425" y="340" text-anchor="middle">复用 DynamicLinker 语义与 fixture</text><rect x="1180" y="395" width="490" height="85" rx="13" fill="#ecfeff" stroke="#06b6d4"/><text class="h" x="1425" y="428" text-anchor="middle">ProcessImageMemory</text><text class="b" x="1425" y="455" text-anchor="middle">mmap / mprotect / COW；每进程 DSO instance</text><rect x="1260" y="515" width="330" height="50" rx="12" fill="#dcfce7" stroke="#22c55e"/><text class="b" x="1425" y="546" text-anchor="middle">initial stack → user thread</text></g>
  <path class="a" d="M375 250V285M375 360V395M375 480V515M1425 250V285M1425 360V395M1425 480V515"/>
  <rect x="735" y="155" width="330" height="350" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/><text x="900" y="193" text-anchor="middle" font-size="17" font-weight="700">可复用的单一链接语义核心</text><text class="b" x="900" y="240" text-anchor="middle">ELF / dynamic parser</text><text class="b" x="900" y="278" text-anchor="middle">依赖图与 scope</text><text class="b" x="900" y="316" text-anchor="middle">symbol / psABI relocation</text><text class="b" x="900" y="354" text-anchor="middle">init-fini plan</text><text class="b" x="900" y="392" text-anchor="middle">TargetAddr + LinkDomainId</text><text class="b" x="900" y="430" text-anchor="middle">ABI note + fixtures + oracle</text><path class="p" d="M570 323H735"/><text class="b" x="652" y="314" text-anchor="middle">调用</text><path class="p" d="M1230 323H1065"/><text class="b" x="1148" y="314" text-anchor="middle">复用</text>
  <rect x="300" y="650" width="1200" height="60" rx="13" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text class="h" x="900" y="687" text-anchor="middle">DsoArtifactCatalog（共享文件身份 / build-id / 只读 backing）</text><rect x="300" y="755" width="500" height="70" rx="13" fill="#dbeafe" stroke="#3b82f6"/><text class="b" x="550" y="783" text-anchor="middle">当前：共享 system instance</text><text class="b" x="550" y="808" text-anchor="middle">代码和普通 RW 状态采用 RTOS 语义</text><rect x="1000" y="755" width="500" height="70" rx="13" fill="#dcfce7" stroke="#22c55e"/><text class="b" x="1250" y="783" text-anchor="middle">未来：每进程 instance</text><text class="b" x="1250" y="808" text-anchor="middle">仅 RX/RO 页可共享；RW/GOT/TLS/ctor 私有</text><path class="a" d="M600 710V755M1200 710V755"/>
  <rect x="380" y="850" width="1040" height="40" rx="11" fill="#fefce8" stroke="#eab308"/><text x="900" y="875" text-anchor="middle" font-size="14" fill="#713f12">迁移原则：现在把 frontend、memory backend、instance registry 做成适配器；不提前实现 Process、initial stack 或用户态解释器。</text>
</svg>
