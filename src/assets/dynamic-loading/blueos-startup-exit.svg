<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" role="img" aria-labelledby="t d"><title id="t">BlueOS RTOS 应用启动、动态链接与退出时序</title><desc id="d">Shell、ApplicationManager、ApplicationLoader、系统 DSO 注册表和应用线程之间的完整启动与退出交互。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.head{font-size:17px;font-weight:700}.msg{font-size:14px;fill:#334155}.line{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 7}.arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#a)}.green{fill:none;stroke:#16a34a;stroke-width:2;marker-end:url(#g)}</style></defs><rect width="1800" height="960" fill="#fff"/><text x="900" y="52" text-anchor="middle" font-size="27" font-weight="700">BlueOS RTOS 应用启动、动态链接与退出时序</text>
  <g><rect x="55" y="85" width="210" height="56" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text class="head" x="160" y="120" text-anchor="middle">Shell</text><rect x="335" y="85" width="260" height="56" rx="13" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text class="head" x="465" y="120" text-anchor="middle">ApplicationManager</text><rect x="665" y="85" width="370" height="56" rx="13" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text class="head" x="850" y="120" text-anchor="middle">ApplicationLoader → DynamicLinker</text><rect x="1105" y="85" width="275" height="56" rx="13" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text class="head" x="1243" y="120" text-anchor="middle">SystemDsoRegistry</text><rect x="1450" y="85" width="295" height="56" rx="13" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text class="head" x="1598" y="120" text-anchor="middle">应用线程 / blueos_scrt1 / libc</text></g>
  <path class="line" d="M160 141V840M465 141V840M850 141V840M1243 141V840M1598 141V840"/><path class="arrow" d="M160 185H465"/><text class="msg" x="312" y="177" text-anchor="middle">① run(path, args)</text>
  <rect x="355" y="215" width="220" height="58" rx="12" fill="#dbeafe" stroke="#60a5fa"/><text class="msg" x="465" y="239" text-anchor="middle">② 准入；创建未发布的</text><text class="msg" x="465" y="260" text-anchor="middle">Loading ThreadGroup</text>
  <path class="arrow" d="M465 305H850"/><text class="msg" x="658" y="297" text-anchor="middle">③ link(main ET_DYN)</text><path class="arrow" d="M850 350H1243"/><text class="msg" x="1046" y="342" text-anchor="middle">④ acquire(libc.so.1)</text>
  <rect x="1125" y="375" width="235" height="80" rx="12" fill="#ffedd5" stroke="#fb923c"/><text class="msg" x="1243" y="399" text-anchor="middle">固定可信路径首装并校验</text><text class="msg" x="1243" y="421" text-anchor="middle">或复用 Ready 实例</text><text class="msg" x="1243" y="443" text-anchor="middle">返回 SystemDsoLease</text>
  <rect x="690" y="475" width="320" height="74" rx="12" fill="#ede9fe" stroke="#a78bfa"/><text class="msg" x="850" y="503" text-anchor="middle">⑤ 依赖闭包 → scope → NOW relocation</text><text class="msg" x="850" y="528" text-anchor="middle">→ RELRO / cache sync</text>
  <path class="arrow" d="M850 580H465"/><text class="msg" x="658" y="572" text-anchor="middle">⑥ PreparedLink：LinkMap + lease + InitPlan</text>
  <rect x="620" y="615" width="820" height="58" rx="12" fill="#dcfce7" stroke="#4ade80"/><text class="msg" x="1030" y="650" text-anchor="middle">⑦ 原子 publish；构造 ApplicationStartInfo；创建主线程</text>
  <path class="green" d="M465 705H1598"/><text class="msg" x="1032" y="697" text-anchor="middle">⑧ _start → ctor → InitComplete / Active → main</text><path class="arrow" d="M1598 755H465"/><text class="msg" x="1032" y="747" text-anchor="middle">⑨ BeginExit(status)</text>
  <rect x="565" y="785" width="900" height="55" rx="12" fill="#fef3c7" stroke="#f59e0b"/><text class="msg" x="1015" y="819" text-anchor="middle">⑩ 等待全部线程 → 逆序 fini → 回收应用映像 → 释放 lease；末 lease 进入静默检查</text>
  <rect x="220" y="875" width="1360" height="55" rx="12" fill="#f8fafc" stroke="#cbd5e1"/><text x="900" y="908" text-anchor="middle" font-size="14" fill="#334155"><tspan font-weight="700">提交边界：</tspan>publish 前失败可回滚；ctor 后外部副作用不可自动撤销。静默检查失败时缓存系统 DSO。</text>
</svg>
